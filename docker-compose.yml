services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orbitmap
      POSTGRES_USER: orbitmap
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ:-Europe/Copenhagen}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitmap -d orbitmap"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    container_name: orbitmap
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3005}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://orbitmap:${DB_PASSWORD}@db:5432/orbitmap
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      TZ: ${TZ:-Europe/Copenhagen}
      FJORDHUB_URL: ${FJORDHUB_URL:-}
      FJORDHUB_APP_ID: ${FJORDHUB_APP_ID:-orbitmap}
      FJORDHUB_API_KEY: ${FJORDHUB_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
